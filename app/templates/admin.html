{% extends "base.html" %}
{% block title %}Admin Panel{% endblock %}
{% block content %}
  <h1>Admin Panel</h1>
  <p>Each setting is configured independently.</p>
  {% for key, value in settings.items() %}
  <form method="post" class="setting">
    <label for="{{ key }}">{{ key.replace('_', ' ').title() }}</label>
    <input type="hidden" name="key" value="{{ key }}">
    <textarea id="{{ key }}" name="value" rows="10">{{ value }}</textarea>
    <button type="submit">Save {{ key.replace('_', ' ').title() }}</button>
  </form>
  {% endfor %}
{% endblock %}
