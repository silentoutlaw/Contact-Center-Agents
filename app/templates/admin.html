{% extends "base.html" %}
{% block page_title %}Admin Panel{% endblock %}
{% block content %}
  <p class="muted" style="margin-top:0">Each setting is configured independently.</p>
  {% for key, value in settings.items() %}
  <div class="card">
    <form method="post" class="setting">
      <label for="{{ key }}">{{ key.replace('_', ' ').title() }}</label>
      <textarea id="{{ key }}" name="value">{{ value }}</textarea>
      <input type="hidden" name="key" value="{{ key }}">
      <button type="submit" class="btn primary">Save {{ key.replace('_', ' ').title() }}</button>
    </form>
  </div>
  {% endfor %}
{% endblock %}
